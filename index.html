<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="碳氮配比 CN Balance · Imbangan C:N — compost C:N, moisture and pile diary for farmers">
<title>碳氮配比 CN Balance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2f6b34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Layout: phone-first single column; sticky header, settings card at top, results below, fixed icon nav at bottom. */
:root{
  --bg:#f2f4ee; --surface:#ffffff; --surface2:#e7ebe1; --line:#c9cfbf;
  --ink:#141a12; --ink2:#2f382b;
  --leaf:#2f6b34; --leaf-soft:#d9ead6; --bark:#7a4a1f; --bark-soft:#efe0cf;
  --water:#1f5f8f; --water-soft:#d6e6f2;
  --good:#1f7a3a; --warn:#a15c00; --bad:#b3261e;
  --good-soft:#d8efdd; --warn-soft:#fbe8c8; --bad-soft:#f8d9d6;
  --shadow:0 1px 2px rgba(20,26,18,.08),0 4px 14px rgba(20,26,18,.06);
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11140f; --surface:#1b2018; --surface2:#252b21; --line:#3a4334;
  --ink:#eef2e8; --ink2:#d3dacb;
  --leaf:#86c98a; --leaf-soft:#22351f; --bark:#e0a86f; --bark-soft:#3a2a1a;
  --water:#8cc4ec; --water-soft:#1b2d3b;
  --good:#7fd896; --warn:#f2b45a; --bad:#ff8a80;
  --good-soft:#1d3523; --warn-soft:#3a2c14; --bad-soft:#3d1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11140f; --surface:#1b2018; --surface2:#252b21; --line:#3a4334;
  --ink:#eef2e8; --ink2:#d3dacb;
  --leaf:#86c98a; --leaf-soft:#22351f; --bark:#e0a86f; --bark-soft:#3a2a1a;
  --water:#8cc4ec; --water-soft:#1b2d3b;
  --good:#7fd896; --warn:#f2b45a; --bad:#ff8a80;
  --good-soft:#1d3523; --warn-soft:#3a2c14; --bad-soft:#3d1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;}

html{font-size:17px}
html[data-size="2"]{font-size:19.5px}
html[data-size="3"]{font-size:22px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;font-weight:500;line-height:1.55;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-num)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--leaf)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--leaf);color:#fff;
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px}
:root[data-theme="dark"] header.top,:root[data-theme="dark"] body::before{background:#1f3b22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top,:root:not([data-theme="light"]) body::before{background:#1f3b22}}
header.top h1{margin:0;font-size:1.12rem;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.hbtn{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;min-width:44px;height:40px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.92rem;flex:none}
.hbtn svg{width:22px;height:22px}

main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
section.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 10px;font-size:1.08rem;font-weight:800;text-wrap:balance}
.label{font-size:.82rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
p{margin:.35em 0}

/* button groups (no selects) */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chip{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:44px;font-weight:700}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.btn{border:2px solid var(--leaf);background:var(--leaf);color:var(--bg);border-radius:8px;padding:10px 16px;min-height:46px;font-weight:800;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--leaf)}
.btn.block{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

/* ingredient rows */
.ing{display:grid;grid-template-columns:10px 1fr auto;grid-template-areas:'sw nm x' 'sw kg kg' 'sw ov ov';column-gap:10px;row-gap:6px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ing .sw{grid-area:sw}.ing .nm{grid-area:nm}.ing .kg{grid-area:kg;justify-content:flex-start}.ing .x{grid-area:x}.ing .ovr{grid-area:ov}
.ing:first-of-type{border-top:0}
.sw{width:10px;align-self:stretch;border-radius:3px}
.sw.N{background:var(--leaf)} .sw.C{background:var(--bark)} .sw.W{background:var(--water)}
.ing .nm{min-width:0}
.ing .nm button{background:none;border:0;padding:0;text-align:left;font-weight:800;font-size:1rem;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.ing .meta{font-size:.86rem;color:var(--ink2)}
.kg{display:flex;align-items:center;gap:6px}
.kg input,.field input{width:5.2em;border:2px solid var(--line);border-radius:8px;background:var(--surface2);padding:8px 8px;font-weight:800;text-align:right;min-height:44px;font-variant-numeric:tabular-nums}
.kg span{font-weight:700;color:var(--ink2)}
.x{border:0;background:none;width:40px;height:40px;border-radius:8px;color:var(--ink2);font-size:1.4rem;line-height:1}
.ovr{display:flex;flex-wrap:wrap;gap:10px;padding:8px;background:var(--surface2);border-radius:8px}
.field{display:flex;flex-direction:column;gap:3px;font-size:.86rem;font-weight:700;color:var(--ink2)}
.field input{width:6em;text-align:left}

/* results */
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .v{font-size:2.6rem;font-weight:900;line-height:1}
.pill{display:inline-block;border-radius:6px;padding:3px 10px;font-weight:800;font-size:.9rem}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.gauge{width:100%;height:auto;display:block;margin-top:8px}
.fix{border:2px solid var(--leaf);background:var(--leaf-soft);border-radius:12px;padding:14px}
.fix.ok{border-color:var(--good);background:var(--good-soft)}
.fix h3{margin:0 0 6px;font-size:1.05rem;font-weight:900}
.fix ul{margin:6px 0 10px;padding-left:1.2em}
.fix li{margin:3px 0;font-weight:700}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:.82rem;color:var(--ink2);font-weight:800}
.scroll{overflow-x:auto}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-weight:700}

/* library */
.mat{display:grid;grid-template-columns:10px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.mat .vals{font-size:.88rem;color:var(--ink2)}
.mat .cnv{font-size:1.4rem;font-weight:900;text-align:right;line-height:1.1}
.mat .cnv small{display:block;font-size:.72rem;font-weight:800;color:var(--ink2);letter-spacing:.05em}
.addbtn{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;min-height:38px;font-weight:800;margin-top:6px}

.spec{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.spr{display:grid;grid-template-columns:minmax(0,9.5em) 1fr;gap:10px;align-items:center;min-height:30px}
.spr>span{font-size:.86rem;font-weight:700;text-align:right;line-height:1.2}
.trk{position:relative;height:22px;border-left:1px solid var(--line);margin-right:16px}
.spr.hd .trk{height:22px;border:0}
.spr.hd i{position:absolute;transform:translateX(-50%);font-style:normal;font-size:.8rem;font-weight:800;color:var(--ink2)}
.trk .zone{position:absolute;top:-4px;bottom:-4px;background:var(--good-soft)}
.trk .ln24{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--line)}
.trk .dot{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%)}
.axcap{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;white-space:nowrap;margin-right:16px;line-height:1.25}.axcap b:last-child{text-align:right}
.trk .dot.N{background:var(--leaf)}.trk .dot.C{background:var(--bark)}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
details.sub{border:0;box-shadow:none;background:transparent}details.sub>summary{padding:6px 0;font-size:.95rem}
details>summary{list-style:none;cursor:pointer;padding:14px;font-weight:900;font-size:1.05rem;display:flex;justify-content:space-between;gap:10px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:1.4rem;color:var(--ink2);flex:none}
details[open]>summary::after{content:"–"}
details .in{padding:0 14px 14px}
.pbar{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}.pbar i{display:block;height:100%}
#v-pile details,#v-mulch details{margin-top:0}
.tl{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px}.tlr{display:grid;grid-template-columns:2em minmax(0,9em) 1fr;gap:10px;align-items:center;border-left:6px solid;border-radius:8px;padding:8px 10px}.tlr b{line-height:1.25}.tlr span{font-weight:700;line-height:1.3}.tln{font-weight:900;color:var(--ink2)}
.cz{display:flex;flex-direction:column;gap:4px;border-left:6px solid;border-radius:8px;padding:8px 12px}.cz span{font-weight:600;line-height:1.4}.cz b{font-size:1rem}
@media (max-width:420px){.tlr{grid-template-columns:1.6em 1fr}.tlr span:last-child{grid-column:2}}
.chk{padding-left:1.4em;margin:8px 0 0}.chk li{margin:0 0 10px}
.ill{width:100%;max-width:560px;height:auto;display:block;margin:8px auto}
.refs li{margin:6px 0;font-size:.92rem}
a{color:var(--water);font-weight:700}

/* nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bot button{border:0;background:none;padding:8px 1px 9px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;font-weight:800;color:var(--ink2);min-height:58px}
nav.bot button svg{width:26px;height:26px;flex:none}
nav.bot button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.74rem}
@media (max-width:380px){html[lang=ms] nav.bot button span{font-size:.68rem;letter-spacing:-.01em}}
input[aria-invalid="true"]{border-color:var(--bad)!important;background:var(--bad-soft)!important}
#setBtn[aria-pressed="true"]{background:#fff;color:var(--leaf)}
#v-set details{margin-top:0}
nav.bot button{position:relative;-webkit-tap-highlight-color:transparent;transition:background-color .15s,color .15s}
nav.bot button svg{padding:3px 12px;box-sizing:content-box;border-radius:14px;transition:background-color .15s}
nav.bot button:active svg{background:var(--leaf-soft);transform:scale(.92)}
nav.bot button[aria-current="page"]{color:var(--leaf)}
nav.bot button[aria-current="page"] svg{background:var(--leaf);color:var(--bg)}
nav.bot button[aria-current="page"] span{font-weight:900;color:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,8,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;
  padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sheet h2{margin:0;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0 14px}
.pick{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;text-align:left;min-height:56px;display:grid;grid-template-columns:8px 1fr;gap:8px}
.pick b{display:block;line-height:1.25}
.pick span{font-size:.82rem;color:var(--ink2);font-weight:700}

/* first launch */
.launch{position:fixed;inset:0;z-index:60;background:var(--leaf);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
:root[data-theme="dark"] .launch{background:#1f3b22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .launch{background:#1f3b22}}
.launch .t1{font-size:2rem;font-weight:900;margin:0;text-align:center}
.launch .t2{font-size:1.1rem;font-weight:700;margin:0;opacity:.95;text-align:center}
.launch .langs{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
.launch .langs button{background:#fff;color:#1f3b22;border:0;border-radius:10px;min-height:56px;font-size:1.15rem;font-weight:900}
@media (prefers-reduced-motion:no-preference){.card,.fix{transition:background .2s}}
</style>
</head>

<header class="top">
  <h1 id="appTitle">碳氮配比</h1>

/* ---------- units (sack / bucket / barrow) ---------- */
const UNITS=['kg','sack','bucket','barrow'];
const ULBL={zh:{kg:'公斤',sack:'包',bucket:'桶',barrow:'手推车'},en:{kg:'kg',sack:'sack',bucket:'bucket',barrow:'wheelbarrow'},ms:{kg:'kg',sack:'guni',bucket:'baldi',barrow:'kereta sorong'}};
function ul(u){return ULBL[L()][u]}
function ulN(u,c){return L()==='en'&&c!==1&&u!=='kg'?ul(u)+'s':ul(u)}
function uw(id){const u=S.unit;if(u==='kg'||id==='water')return 1;return (S.uw[id]&&S.uw[id][u])||null}
function qtyText(id,kg,fb){ // "6.5 sacks rice husk (≈81 kg)"
  const u=S.unit,w=uw(id),name=esc(matName(id,fb));
  if(id==='water')return `<span class="num">${kgFmt(kg)}</span> ${t('L')} ${name}`;
  if(u==='kg'||!w)return `<span class="num">${kgFmt(kg)}</span> ${t('kg')} ${name}`;
  const c=Math.round(kg/w*2)/2;if(c<0.5)return `<span class="num">${kgFmt(kg)}</span> ${t('kg')} ${name}`;return `<span class="num">${f(c,1)}</span> ${ulN(u,c)} ${name} <span class="small muted">(≈${kgFmt(kg)} ${t('kg')})</span>`}

/* ---------- dates ---------- */
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayDiff(a,b){return Math.round((Date.parse(b+'T00:00:00')-Date.parse(a+'T00:00:00'))/864e5)}
function dayLbl(n){return L()==='zh'?`第 ${n} 天`:`${t('dayN')} ${n}`}
function dFmt(s){const [y,m,d]=s.split('-');return L()==='zh'?`${+m}月${+d}日`:`${+d}/${+m}`}

/* ---------- pile diary ---------- */
const HOT_LO=55,HOT_HI=77,HOT_DAYS=15,TURNS=5;
function pileStats(p){
  const logs=p.logs.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const hotDates=[];let firstHot=null,doneDate=null;
  // one entry per date: keep max temp, any turn
  const byDate={};logs.forEach(l=>{const o=byDate[l.d]||(byDate[l.d]={d:l.d,t:null,turn:false});if(l.t!=null&&(o.t==null||l.t>o.t))o.t=l.t;if(l.turn)o.turn=true});
  const days=Object.values(byDate).sort((a,b)=>a.d<b.d?-1:1);
  let turnsHot=0,lastTurn=null;
  days.forEach(x=>{
    if(x.t!=null&&x.t>=HOT_LO&&x.t<=HOT_HI&&!doneDate){hotDates.push(x.d);if(!firstHot)firstHot=x.d;if(hotDates.length===HOT_DAYS)doneDate=x.d}
    if(x.turn){lastTurn=x.d;if(firstHot&&x.d>=firstHot&&(!doneDate||x.d<=doneDate))turnsHot++}
  });
  const withT=days.filter(x=>x.t!=null);const last=withT[withT.length-1]||null;
  return {days,hot:hotDates.length,turnsHot,firstHot,lastTurn,last,
    hotDone:hotDates.length>=HOT_DAYS,allDone:hotDates.length>=HOT_DAYS&&turnsHot>=TURNS,age:Math.max(0,dayDiff(p.start,today()))}}
function pileAdvice(p,st){
  const td=today(),tr=st.days.find(x=>x.d===td),tt=tr&&tr.t!=null?tr.t:null;
  if(st.last&&st.last.t>HOT_HI&&st.last.d===td)return ['bad','advHotHi'];
  const tl=p.logs.filter(l=>l.d===td);const lastL=tl[tl.length-1];
  if(lastL&&lastL.sq==='dry')return ['warn','advSqDry'];
  if(lastL&&(lastL.sq==='wet'||lastL.rain))return ['warn','advSqWet'];
  if(st.allDone){const c=p.cure||{};return (c.reheat&&c.smell&&c.seed)?['good','advReady']:['good','advCure']}
  if(st.hotDone)return ['warn','advMoreTurns'];
  if(tt==null)return ['warn','advMeasure'];
  if(tt<HOT_LO){return st.hot>0?['warn','advCooled']:['warn','advWarming']}

/* ---------- math ---------- */
function coef(m,ov){const n=ov&&ov.n!=null?ov.n:m.n,cn=ov&&ov.cn!=null?ov.cn:m.cn,mo=ov&&ov.m!=null?ov.m:m.m;
  const d=1-mo/100,nk=d*n/100;return {n:nk,c:nk*cn,s:mo/100}}
function totals(rows){let W=0,C=0,N=0,Sw=0;rows.forEach(r=>{const m=mat(r.id);if(!m)return;const k=+r.kg||0;const q=coef(m,r.ov);W+=k;C+=k*q.c;N+=k*q.n;Sw+=k*q.s});
  return {W,C,N,Sw,cn:N>0?C/N:NaN,mo:W>0?Sw/W*100:NaN}}
function cnBand(v){if(v<20)return ['bad','cn1'];if(v<25)return ['warn','cn2'];if(v<=35)return ['good','cn3'];if(v<=45)return ['warn','cn4'];return ['bad','cn5']}
function mBand(v){if(v<40)return ['bad','m1'];if(v<50)return ['warn','m2'];if(v<=60)return ['good','m3'];if(v<=65)return ['warn','m4'];return ['bad','m5']}

function solveFix(rows){
  const tot=totals(rows);if(!(tot.W>0)||!(tot.N>0))return null;
  const R=S.cn,g=S.m/100;
  const cnOK=Math.abs(tot.cn-R)<=3, mOK=tot.mo>=S.m-5&&tot.mo<=S.m+5;
  if(cnOK&&mOK)return {ok:true};
  const inMix=[...new Set(rows.map(r=>r.id))].filter(id=>id!=='urea'&&mat(id));
  const helpers=['husk','sawdust','straw','cattle','grass'].concat(S.noChicken?[]:['broiler','layer']);
  let cands=['water'].concat(inMix,helpers.filter(h=>!inMix.includes(h)));
  const ovOf=id=>{const r=rows.find(x=>x.id===id);return r?r.ov:null};
  const q=id=>coef(mat(id),ovOf(id));
  const b1=R*tot.N-tot.C, b2=g*tot.W-tot.Sw;
  const pen=id=>id==='water'?1:(inMix.includes(id)?1:1.3);
  let best=null;
  const consider=(adds)=>{let sc=0,sum=0;for(const a of adds){if(!(a.x>=0)||!isFinite(a.x))return;sc+=a.x*pen(a.id);sum+=a.x}
    if(sum>tot.W*4)return; const res=totals(rows.concat(adds.filter(a=>a.x>0.05).map(a=>({id:a.id,kg:a.x,ov:ovOf(a.id)}))));
    if(Math.abs(res.cn-R)>3.2||res.mo<S.m-5.5||res.mo>S.m+5.5)return;
    if(!best||sc<best.sc)best={sc,adds:adds.filter(a=>a.x>0.05),res}};
  const run=()=>{for(let i=0;i<cands.length;i++){const a=q(cands[i]);
    const a1=a.c-R*a.n,a2=a.s-g;
    if(Math.abs(a1)>1e-9)consider([{id:cands[i],x:b1/a1}]);
    if(Math.abs(a2)>1e-9)consider([{id:cands[i],x:b2/a2}]);
    for(let j=i+1;j<cands.length;j++){const b=q(cands[j]);const c1=b.c-R*b.n,c2=b.s-g;
      const det=a1*c2-c1*a2;if(Math.abs(det)<1e-12)continue;
      consider([{id:cands[i],x:(b1*c2-c1*b2)/det},{id:cands[j],x:(a1*b2-b1*a2)/det}]);}
  }};
  run();
  if(!best&&!cands.includes('urea')){cands=cands.concat('urea');run()}
  let urea=null;
  if(tot.cn>R+3){const u=coef(mat('urea'));const x=b1/(u.c-R*u.n);if(x>0)urea=x}
  return {ok:false,best,urea};
}

function f(v,d){if(!isFinite(v))return '–';const p=Math.pow(10,d==null?1:d);return (Math.round(v*p)/p).toLocaleString(L()==='zh'?'zh-CN':(L()==='ms'?'ms-MY':'en-MY'))}
function kgFmt(x){return x>=10?f(x,0):(x>=1?f(x,1):f(x,2))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function gaugeSVG(v){
  const W=600,H=86,x0=20,x1=580,max=60;const X=c=>x0+(Math.min(Math.max(c,0),max)/max)*(x1-x0);
  const zones=[[0,20,'bad'],[20,25,'warn'],[25,35,'good'],[35,45,'warn'],[45,60,'bad']];
  let s=`<svg class="gauge" viewBox="0 -4 ${W} ${H+10}" role="img" aria-label="C:N ${f(v,1)}">`;
  zones.forEach(z=>{s+=`<rect x="${X(z[0])}" y="30" width="${X(z[1])-X(z[0])}" height="18" fill="var(--${z[2]}-soft)" stroke="var(--${z[2]})" stroke-width="1"/>`});
  [0,10,20,25,30,35,45,60].forEach(c=>{s+=`<text x="${X(c)}" y="78" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink2)">${c===60?'60+':c}</text>`});
  const tx=X(S.cn);s+=`<line x1="${tx}" y1="24" x2="${tx}" y2="54" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3"/>`;
  if(isFinite(v)){const px=X(v);s+=`<path d="M${px-9} 6 L${px+9} 6 L${px} 26 Z" fill="var(--ink)"/><rect x="${px-2}" y="26" width="4" height="26" fill="var(--ink)"/>`}
  s+=`</svg>`;return s}
function squeezeSVG(mo){
  const drops=mo<50?0:(mo<=60?2:5);const crumbly=mo<45;
  let s=`<svg viewBox="0 0 120 90" width="96" height="72" aria-hidden="true" style="flex:none">`;
  s+=`<path d="M30 20 Q60 6 90 20 L92 46 Q60 58 28 46 Z" fill="var(--bark-soft)" stroke="var(--bark)" stroke-width="2"/>`;
  s+=`<path d="M36 22 v20 M50 18 v24 M64 18 v24 M78 20 v22" stroke="var(--bark)" stroke-width="2" opacity=".55"/>`;
  if(crumbly)s+=`<circle cx="40" cy="64" r="3" fill="var(--bark)"/><circle cx="55" cy="72" r="2.5" fill="var(--bark)"/><circle cx="72" cy="66" r="3" fill="var(--bark)"/>`;
  for(let i=0;i<drops;i++){const x=46+i*8,y=58+(i%2)*10;s+=`<path d="M${x} ${y} q-4 7 0 9 q4 -2 0 -9z" fill="var(--water)"/>`}
  s+=`</svg>`;return s}
function renderResults(){

      if(wet)inner+=`<p class="small" style="margin-top:10px">${t('dryFirst').replace('{x}',esc(nm(wet)))}</p>`}
    if(fx.urea)inner+=`<p class="small" style="margin-top:10px">${t('orUrea')}: <b class="num">${kgFmt(fx.urea)} ${t('kg')}</b> ${esc(nm(mat('urea')))}</p>`;

    ${gaugeSVG(tot.cn)}
    <div style="display:flex;gap:12px;align-items:center;margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
      ${squeezeSVG(tot.mo)}
      <div style="min-width:0"><p class="label" style="margin:0">${t('resM')}</p>
      <div class="big"><span class="v num" style="font-size:2rem">${f(tot.mo,0)}%</span><span class="pill ${mb}">${t(mk)}</span></div>
      <p class="small muted">${t('squeeze')}</p></div>
    </div>
    ${S.sq?`<p style="margin-top:8px;font-weight:700">${t('sqMsg'+S.sq[0].toUpperCase()+S.sq.slice(1))}</p>`:''}
    <div>
    </div>
  </div>
  ${fixHTML}
  <details class="card" style="padding:0"><summary>${t('recipe')}</summary><div class="in scroll">
    <table><thead><tr><th></th><th>${t('kg')}</th><th>${t('share')}</th><th>${t('nkg')}</th><th>${t('ckg')}</th></tr></thead>
    <tbody>${rowsT}<tr><td><b>${t('total')}</b></td><td><b>${kgFmt(tot.W)}</b></td><td>100%</td><td><b>${f(tot.N,2)}</b></td><td><b>${f(tot.C,1)}</b></td></tr></tbody></table>
    <p style="margin-top:10px">${t('nBudget').replace(/\{n\}/g,f(tot.N,1)).replace('{lo}',f(tot.N*0.6,1))}</p>
    <p class="small muted" style="margin-top:10px"><b>${t('howCalc')}.</b> ${t('howCalcBody')}</p>

}

function spectrumSVG(){

  const lo=Math.log10(3),hi=Math.log10(600);const P=v=>(Math.log10(Math.min(Math.max(v,3),600))-lo)/(hi-lo)*100;
  const ticks=[3,10,24,100,600];
  let h=`<div class="spec"><div class="spr hd"><span style="font-weight:800">C:N</span><div class="trk">${ticks.map(v=>`<i style="left:${P(v)}%">${v}</i>`).join('')}</div></div>`;
  list.forEach(m=>{const g=grp(m);h+=`<div class="spr"><span>${esc(nm(m))}</span><div class="trk"><b class="zone" style="left:${P(25)}%;width:${P(35)-P(25)}%"></b><b class="ln24" style="left:${P(24)}%"></b><b class="dot ${g}" style="left:${P(m.cn)}%"></b></div></div>`});

const MULCHWHY={
zh:`<ol class="chk"><li><b>保湿降温。</b>表土少晒少风，水分蒸发少，大热天也凉一些。榴莲的吸收根大多在表层，干旱时最先受苦，覆盖物保护的正是它们。</li>
<li><b>挡住暴雨冲刷。</b>雨点直接打在裸土上，会打碎土粒、封住表面、冲走表土。有覆盖，雨水慢慢渗进去，坡地果园特别重要（美国 NRCS）。</li>
<li><b>慢慢放出养分，尤其是钾。</b>空果串干重约含 N 0.8%、P 0.1%、K 2.5%、Mg 0.2%；铺在油棕下，约 10 个月内放出 99% 以上的钾。榴莲果实带走很多钾，空果串等于慢效钾肥。</li>
<li><b>压住杂草。</b>吸收根附近少了杂草抢水抢肥，也省除草工。</li>
<li><b>养土壤、养生物。</b>烂掉后变成腐殖质，也给分解残体、吃草籽的小虫一个家。13 年油棕园每英亩铺约 14 吨空果串（35 吨/公顷），表层 20 厘米有机质增加（但那次没有测到微生物增加）。</li></ol>
<p><b>代价：</b>高碳覆盖物会向土壤借氮（上面已算）；不要堆在树头，否则树皮长期潮湿，利于疫霉等树干病；旱季干稻草、木屑可能着火，太干就别铺太厚。</p>`,
en:`<ol class="chk"><li><b>Keeps soil moist and cool.</b> Covered soil loses far less water to sun and wind and stays cooler on hot days. Durian feeding roots are mostly near the surface and suffer first in dry spells; mulch protects exactly them.</li>
<li><b>Shields soil from heavy rain.</b> Raindrops on bare soil smash soil crumbs, seal the surface and wash topsoil away. Under mulch, rain soaks in, which matters on hillside orchards (USDA NRCS).</li>
<li><b>Releases nutrients slowly, especially K.</b> EFB is about 0.8% N, 0.1% P, 2.5% K and 0.2% Mg on dry weight; under oil palm, over 99% of its K was released within about 10 months. Durian fruit removes a lot of potassium, so EFB works like slow-release potash.</li>
<li><b>Smothers weeds.</b> Fewer weeds competing for water and fertiliser where the feeding roots are, and less weeding work.</li>
<li><b>Builds soil and feeds soil life.</b> It becomes humus and shelters the small creatures that shred residue and eat weed seeds. In a 13-year-old oil palm stand, about 14 t of EFB per acre (35 t/ha) raised organic matter in the top 20 cm (that study did not find more microbes).</li></ol>
<p><b>The costs:</b> high-carbon mulch borrows nitrogen (calculated above); never heap it against the trunk, which keeps bark wet and favours trunk diseases such as Phytophthora; dry straw or sawdust can burn in a long dry season, so don't build thick dry layers.</p>`,
ms:`<ol class="chk"><li><b>Tanah lembap dan sejuk.</b> Tanah bertutup kurang kehilangan air kepada matahari dan angin, dan lebih sejuk pada hari panas. Akar penyerap durian kebanyakannya dekat permukaan dan paling awal terjejas ketika kering; sungkupan melindunginya.</li>
<li><b>Lindung daripada hujan lebat.</b> Titis hujan atas tanah terdedah memecahkan butir tanah, menutup permukaan dan menghakis tanah atas. Di bawah sungkupan, air meresap masuk; penting di dusun berbukit (USDA NRCS).</li>
<li><b>Lepas nutrien perlahan, terutama K.</b> EFB kira-kira N 0.8%, P 0.1%, K 2.5%, Mg 0.2% berat kering; di bawah sawit, lebih 99% K dilepaskan dalam ~10 bulan. Buah durian membawa keluar banyak kalium, jadi EFB seperti baja kalium lambat lepas.</li>
<li><b>Menekan rumpai.</b> Kurang rumpai berebut air dan baja di zon akar penyerap, dan kurang kerja merumput.</li>
<li><b>Membina tanah dan hidupan tanah.</b> Menjadi humus dan tempat berlindung hidupan kecil yang mencarik sisa dan makan biji rumpai. Di ladang sawit 13 tahun, ~14 tan EFB seekar (35 tan/ha) menaikkan bahan organik 20 cm atas (kajian itu tidak mendapati mikrob bertambah).</li></ol>
<p><b>Kosnya:</b> sungkupan tinggi karbon meminjam nitrogen (dikira di atas); jangan longgok pada pangkal batang kerana kulit kekal basah dan menggalakkan penyakit batang seperti Phytophthora; jerami atau habuk kayu kering boleh terbakar dalam musim kering panjang, jadi jangan buat lapisan kering yang tebal.</p>`};
const MULCHFLOWER={
zh:`<p><b>高碳覆盖物不会让氮太多。</b>空果串、木屑、稻草在分解时是向土壤<b>借</b>氮，不是放氮。会在短时间放出很多氮的，是低碳氮比的材料：生鸡粪、新割青草、新鲜修剪枝叶。开花前要少氮、多磷钾，避免抽新叶跟花争养分（Haifa 榴莲施肥指南）——所以从新叶老熟到坐果，<b>不要加这些富氮的新料</b>。空果串放出的是钾，正好合用。</p>
<p><b>真正要注意的是水分。</b>榴莲要一段干旱期才会成花（Haifa：约 1–2 个月）。覆盖物保湿，铺太厚可能减弱这个“干”的信号——这是推论，我没有找到有机覆盖与榴莲成花的直接试验。反过来，泰国 Monthong 试验用透气塑料膜挡雨约 54 天，造成严重干旱：现蕾和开花延迟，每米枝条花序从约 9 个降到不到 1 个（Kozai 等 2024）。轻度干旱催花，严重干旱伤花。</p>
<p><b>默认做法：</b>收果后到抽叶期铺新的覆盖物；催花期保留原有的、不要加厚、不要浇水；开花到坐果不加任何富氮的新料；坐果后覆盖帮助保持水分平稳。厄尔尼诺长旱年份，覆盖物反而能防止干过头。</p><h3 style="margin:16px 0 6px;font-size:1.05rem">正在开花时，覆盖物能防落花吗？</h3><p>帮助很有限，只对一种原因有用。落一部分花是正常的：泰国 Monthong 研究中，落花最少的树也落了 60–70%，最多的落 87–93%；落花少的树，花里的糖和淀粉较多（只是趋势，统计上未证实）。</p><div class="tl"><div class="cz" style="background:var(--bad-soft);border-color:var(--bad)"><span>授粉不完全（榴莲夜间开花，主要靠蝙蝠）。越南 Musang King 研究：早期落果主要因授粉不完全；人工授粉坐果率达 93%。</span><b style="color:var(--bad)">没帮助</b></div><div class="cz" style="background:var(--bad-soft);border-color:var(--bad)"><span>大雨：雨多的年份（如 2017）产量明显下降，雨水减少授粉动物活动（UTM 研究）。</span><b style="color:var(--bad)">没帮助</b></div><div class="cz" style="background:var(--bad-soft);border-color:var(--bad)"><span>新叶抽出，跟花和小果争碳水化合物。</span><b style="color:var(--bad)">没帮助；富氮新料反而更糟</b></div><div class="cz" style="background:var(--good-soft);border-color:var(--good)"><span>天热时树下土壤干裂、升温。</span><b style="color:var(--good)">有帮助</b></div></div><p><b>现在开花，这样做：</b></p><ul class="chk"><li>原有的覆盖物保留，不要翻动。</li><li>如果树下是裸土、天热快干，可铺一层薄的、干的、低氮旧料（旧空果串、干落叶），离开树头。</li><li>不要加富氮的东西：生鸡粪、新割草、新鲜枝叶、尿素，以免催出新叶跟花抢养分。</li><li>不要现在铺厚的新鲜空果串——坐果时它正在向土壤借氮。</li><li>检查排水，大雨才是现在更大的威胁。</li></ul><p>授粉和天气对结果的影响，比覆盖物大得多。</p>`,
en:`<p><b>High-carbon mulch will not push nitrogen too high.</b> EFB, sawdust and straw <b>borrow</b> nitrogen while they rot; they don't release it. The materials that release a lot of N quickly are the low C:N ones: raw chicken dung, fresh grass clippings, fresh tree trimmings. Before flowering, durian should get less N and more P and K so a leaf flush doesn't compete with the flowers (Haifa durian fertiliser guide). So from the time new leaves harden until fruit set, <b>don't add fresh N-rich material</b>. What EFB releases is potassium, which suits this stage.</p>
<p><b>Water is the real issue.</b> Durian needs a dry spell to set flowers (Haifa: about 1–2 months). Mulch keeps soil moist, so a thick fresh layer could soften that dry signal. That is reasoning, not a tested result; I found no direct trial of organic mulch and durian flowering. In the other direction, a Thai Monthong trial used breathable plastic sheeting to keep rain off for about 54 days. The severe drought delayed bud emergence and flowering and cut flower clusters from about 9 to under 1 per metre of branch (Kozai et al. 2024). Mild drought induces flowers; severe drought destroys them.</p>
<p><b>Default:</b> spread new mulch after harvest through leaf flush; during induction keep what is there, don't thicken it and don't irrigate; from flowering to fruit set add no fresh N-rich material; after fruit set the mulch helps keep moisture steady. In a long El Niño drought, mulch helps stop the trees drying out too far.</p><h3 style="margin:16px 0 6px;font-size:1.05rem">Flowering now: will mulch stop flowers dropping?</h3><p>Only a little, and only for one cause. Some drop is normal: in a Thai Monthong study the best trees still dropped 60–70% of their flowers and the worst 87–93%; low-drop trees had more sugars and starch in their flowers (a tendency, not statistically confirmed).</p><div class="tl"><div class="cz" style="background:var(--bad-soft);border-color:var(--bad)"><span>Incomplete pollination (durian flowers at night, mainly bat-pollinated). A Vietnamese Musang King study blamed early fruit drop mostly on incomplete pollination; hand pollination reached 93% fruit set.</span><b style="color:var(--bad)">No help</b></div><div class="cz" style="background:var(--bad-soft);border-color:var(--bad)"><span>Heavy rain: wet years such as 2017 had clearly lower yields, and rain reduces pollinator activity (UTM study).</span><b style="color:var(--bad)">No help</b></div><div class="cz" style="background:var(--bad-soft);border-color:var(--bad)"><span>A new leaf flush competing with flowers and young fruit for carbohydrates.</span><b style="color:var(--bad)">No help; N-rich mulch makes it worse</b></div><div class="cz" style="background:var(--good-soft);border-color:var(--good)"><span>Soil under the tree drying and heating up in hot weather.</span><b style="color:var(--good)">Helps</b></div></div><p><b>While the tree is blooming:</b></p><ul class="chk"><li>Keep the mulch you already have; don't disturb it.</li><li>If the ground is bare and drying out in hot weather, a thin layer of dry, old, low-nitrogen material (old EFB, dry leaves) is fine, kept away from the trunk.</li><li>Add nothing nitrogen-rich: no raw chicken dung, fresh grass, fresh trimmings or urea. They can push a leaf flush that competes with the flowers.</li><li>Don't lay a thick layer of fresh EFB now; it would be borrowing nitrogen just as fruit set begins.</li><li>Make sure drainage works; heavy rain is the bigger threat right now.</li></ul><p>Pollination and weather decide much more of the outcome than mulch.</p>`,
ms:`<p><b>Sungkupan tinggi karbon tidak menaikkan nitrogen berlebihan.</b> EFB, habuk kayu dan jerami <b>meminjam</b> nitrogen semasa reput, bukan membebaskannya. Bahan yang cepat membebaskan banyak N ialah bahan C:N rendah: tahi ayam mentah, rumput baru dipotong, cantasan segar. Sebelum berbunga, durian patut dapat kurang N dan lebih P dan K supaya pucuk baru tidak bersaing dengan bunga (panduan baja durian Haifa). Jadi dari daun baru matang hingga pembentukan buah, <b>jangan tambah bahan kaya N segar</b>. EFB membebaskan kalium, sesuai pada peringkat ini.</p>
<p><b>Isu sebenar ialah air.</b> Durian perlukan tempoh kering untuk berbunga (Haifa: ~1–2 bulan). Sungkupan mengekalkan lembapan, jadi lapisan baru yang tebal mungkin melemahkan isyarat kering itu. Ini penaakulan, bukan hasil ujian; saya tidak menemui kajian langsung sungkupan organik dan pembungaan durian. Sebaliknya, ujian Monthong di Thailand menggunakan plastik telap wap untuk menghalang hujan ~54 hari. Kemarau teruk melewatkan putik dan pembungaan, dan mengurangkan jambak bunga dari ~9 kepada kurang 1 semeter dahan (Kozai et al. 2024). Kemarau ringan mengaruh bunga; kemarau teruk merosakkannya.</p>
<p><b>Lalai:</b> tabur sungkupan baru selepas tuai hingga pucuk baru; semasa aruhan kekalkan yang ada, jangan tebalkan dan jangan siram; dari berbunga hingga pembentukan buah jangan tambah bahan kaya N segar; selepas buah terbentuk sungkupan membantu lembapan stabil. Dalam kemarau panjang El Niño, sungkupan membantu pokok tidak terlalu kering.</p><h3 style="margin:16px 0 6px;font-size:1.05rem">Sedang berbunga: bolehkah sungkupan mengelak bunga gugur?</h3><p>Sedikit sahaja, dan untuk satu sebab sahaja. Sebahagian bunga gugur adalah normal: dalam kajian Monthong di Thailand, pokok terbaik masih menggugurkan 60–70% bunga dan yang paling teruk 87–93%; pokok kurang gugur mempunyai lebih banyak gula dan kanji dalam bunga (kecenderungan, belum disahkan secara statistik).</p><div class="tl"><div class="cz" style="background:var(--bad-soft);border-color:var(--bad)"><span>Pendebungaan tidak lengkap (durian berbunga waktu malam, kebanyakannya didebunga kelawar). Kajian Musang King di Vietnam: buah gugur awal kebanyakannya akibat pendebungaan tidak lengkap; pendebungaan tangan mencapai 93% pembentukan buah.</span><b style="color:var(--bad)">Tidak membantu</b></div><div class="cz" style="background:var(--bad-soft);border-color:var(--bad)"><span>Hujan lebat: tahun basah seperti 2017 hasil jelas menurun, dan hujan mengurangkan aktiviti pendebunga (kajian UTM).</span><b style="color:var(--bad)">Tidak membantu</b></div><div class="cz" style="background:var(--bad-soft);border-color:var(--bad)"><span>Pucuk baru bersaing dengan bunga dan buah muda untuk karbohidrat.</span><b style="color:var(--bad)">Tidak membantu; bahan kaya N memburukkan</b></div><div class="cz" style="background:var(--good-soft);border-color:var(--good)"><span>Tanah bawah pokok kering dan panas ketika cuaca panas.</span><b style="color:var(--good)">Membantu</b></div></div><p><b>Semasa pokok berbunga:</b></p><ul class="chk"><li>Kekalkan sungkupan sedia ada; jangan kacau.</li><li>Jika tanah terdedah dan cepat kering ketika panas, lapisan nipis bahan lama yang kering dan rendah nitrogen (EFB lama, daun kering) boleh, jauh dari pangkal batang.</li><li>Jangan tambah bahan kaya nitrogen: tahi ayam mentah, rumput segar, cantasan segar atau urea. Ia boleh mencetuskan pucuk baru yang bersaing dengan bunga.</li><li>Jangan tabur EFB segar yang tebal sekarang; ia akan meminjam nitrogen tepat ketika buah mula terbentuk.</li><li>Pastikan saliran berfungsi; hujan lebat ialah ancaman lebih besar sekarang.</li></ul><p>Pendebungaan dan cuaca jauh lebih menentukan hasil berbanding sungkupan.</p>`};

zh:[
 ['碳氮比是什么？',`<p>碳氮比（C:N）= 材料里<b>碳的重量 ÷ 氮的重量</b>。10:1 就是每 1 份氮配 10 份碳。化验报告的碳%和氮%都按干重算，所以相除得到的比例跟湿重干重无关。</p><p>碳是微生物的“饭”（能量），氮是它们长身体用的“肉”（蛋白质）。比例对了，材料才烂得快。</p>`],
 ['24:1 是微生物最爱吃的比例',`${plateSVG()}<p>土壤微生物本身大约是 <b>8:1</b>。它们吃进去的碳有一部分要烧掉当能量，所以要吃 <b>24:1</b> 的“饭”：16 份碳烧掉，8 份碳加 1 份氮变成身体（美国 NRCS）。</p>`],
 ['高于 24 借氮，低于 24 放氮',`<p><b>高于 24:1</b>（稻草 80、空果串约 52、木屑 500 以上）：微生物氮不够，会<b>向土壤借氮</b>（氮固持）。这段时间作物可能缺氮，等微生物死掉分解后才还回来。</p><p><b>低于 24:1</b>（鸡粪 6–14、新割草 17）：多出来的氮被放出来给作物用（矿化），但材料很快就烂完。</p><p><b>注意：</b>${t('seesawNote')}树本身的碳氮比是另一回事，见下面“两种碳氮比：材料和树”。</p>`],
 ['堆肥：起堆 25–35，完成 10–15',`${curveSVG()}<p>起堆时碳氮比约 <b>30:1</b> 最常用（康奈尔大学）；20–40 都能成功，25–30 最理想（《农场堆肥手册》）。马来西亚博特拉大学用空果串加 POME 厌氧污泥试验，起始 <b>35:1</b> 分解最好。</p><p>堆的过程中碳变成二氧化碳跑掉，碳氮比一路下降，成品约 10–15。</p><ul><li><b>太低</b>（&lt;20）：氮变成氨气跑掉，有臭氨味。</li><li><b>太高</b>（&gt;40）：堆不热，几个月都不烂。</li></ul>`],
 ['含水量 50–60%',`<p>含水量按<b>湿重</b>算。大部分材料以 50–60% 为好。手捏测试：用力捏一把，滴一两滴水就对了；捏不出水又松散 = 太干；水一直流 = 太湿、会缺氧发臭。</p><p><b>湿的褐料陷阱：</b>榴莲壳碳氮比约 50（褐料），但含水约 85%。直接堆会太湿。先切碎晒干，或配谷壳、木屑这类干的褐料。泰国研究把榴莲壳和柑橘皮 1:1 堆，起始含水 78–85%，堆不热（只到约 41 °C）。</p>`],
 ['不是所有碳都一样快',`<p>木屑、空果串、榴莲壳含很多木质素，碳很“硬”，微生物吃得慢。所以这类材料起堆碳氮比可以偏高一点（康奈尔）。<b>切碎、压碎</b>能加快分解——马来西亚大多数油棕厂都先把空果串切碎。</p>`],
 ['覆盖物与果园',`<p>新鲜的高碳覆盖物（空果串、木屑、稻草）铺在树下，会在接触土壤的地方借氮。翻进土里借得更多，铺在表面借得少、慢。土壤有机质本身约 10:1。</p><p>做法：铺表面不翻土；树头周围留空位；照常施肥；小树发黄才补氮。或者先堆成熟再铺。在“覆盖”页可以算每棵树最多会被借多少氮。</p>`],
['两种碳氮比：材料和树',`${twoCnSVG()}<p>本软件算的是<b>材料的碳氮比</b>（堆肥、覆盖物）。果农常说的“碳氮比高才开花”，指的是<b>树本身的碳氮比</b>：叶子做出的碳水化合物，对比根吸进来的氮。这是 1918 年 Kraus 和 Kraybill 提出的老理论。两者只是间接相关。</p>
<p><b>榴莲的证据：</b>柬埔寨 Monthong 试验（Var 等 2026），干旱 28 天后：</p>${droughtSVG()}<p>叶片氮下降、叶片碳氮比上升，花多了约一倍，产量增加约 31%（58.5 → 76.4 公斤/棵）。但该试验没有量碳水化合物，只有一个地点、一年，所以只能说两者同时发生，不能证明是碳氮比导致开花。</p>
<p><b>不是全部：</b>苹果研究发现成花跟树的碳平衡、淀粉没有直接关系，赤霉素等激素信号更重要（Belhassine 等 2019）；多效唑就是阻断赤霉素。干旱太严重反而毁花（Kozai 等 2024）。</p>
<p><b>默认做法：</b>用<b>施肥时间和水分</b>来调树的碳氮比，不要用高碳覆盖物或半熟堆肥：抽叶期给氮，长出满树叶子（下一次开花的“碳水工厂”）；新叶老熟后停氮、让它轻度干旱；开花到坐果不加富氮新料；堆肥一定要腐熟（碳氮比约 10–20）才施用。</p>`],
 ['鸡粪会带线虫吗？',`<p>很多果农不用鸡粪，怕带来线虫。可以理解，但研究结果大多相反：</p><ul><li><b>鸡不是植物线虫的寄主。</b>根结线虫等要靠植物根才能繁殖，不会在鸡肚子里繁殖。生鸡粪里扭动的小虫，多半是吃细菌的自由生活线虫，不伤根。</li><li><b>鸡粪常被用来压线虫。</b>美国北卡试验：每英亩 4–6 吨禽类垫料减少了根结线虫，棉花增产。</li><li><b>热堆能杀线虫。</b>法国 ANSES 研究：堆肥和厌氧消化在所有测试条件下都很有效；50 °C 30 分钟或 60 °C 3 分钟就能杀死根结线虫和马铃薯孢囊线虫。</li></ul><p>真正的风险来自<b>没堆熟的生粪</b>（烧根、氨味、苍蝇），或混了别处带病泥土的粪。所以本软件默认<b>不建议鸡粪</b>；牛粪、青草、尿素也能把碳氮比调下来。要用鸡粪，请照下面的条件做。</p>`],
['安全使用鸡粪的条件',`${chickSVG()}<ol class="chk">
<li><b>热堆，用温度计量。</b>起堆碳氮比 25–40，含水 50–60%。条形堆：中心保持 55–77 °C 共 15 天，期间至少翻 5 次；密闭或通气堆：3 天（美国有机标准 §205.203）。用长探针温度计插到中心量，不要靠手摸。这个温度远高于杀死线虫所需（50 °C 30 分钟），也能消灭沙门氏菌。</li>
<li><b>腐熟后才用。</b>翻堆后不再发热、有泥土味没有氨味、碳氮比 ≤20、种子发芽测试正常（≥80%）。半熟的会烧根。</li>
<li><b>生鸡粪：收果前 120 天以上。</b>榴莲落地后捡起来吃，算是果实接触土壤的作物，生粪要在收果前至少 120 天翻进土里。实际做法：开花到收果期间绝对不用生鸡粪。</li>
<li><b>来源要干净。</b>用鸡舍垫料（谷壳或木屑），不要混了别人农场泥土的鸡粪——那才是线虫和土传病真正的传播途径。不要有死鸡；堆之前盖好保持干。</li>
<li><b>施在对的位置。</b>撒在树冠外缘（吸收根所在）的表面，适量；不要堆在树头。</li></ol>`],
 ['堆肥要施多少？',`<p><b>找不到榴莲“堆肥”用量的正式数字</b>：泰国农业厅 2022 年榴莲报告只说有机肥要和化肥一起用，没有给量。</p>
<p>找到的马来西亚官方数字是<b>鸡粪</b>：砂拉越农业部建议种植时每穴 5–10 公斤，之后每棵每年 20–40 公斤，另加化肥。</p>
<p><b>默认做法：</b>以这个范围为上限参考，全年分次撒在树冠外缘的表面，避开开花到坐果期（见“覆盖”页）。成品堆肥的养分每批都不同，量大时最好化验氮磷钾，再跟您的农艺师对照施肥计划。</p>`],
 ['看化验报告',`<p>请化验室做<b>有机碳</b>和<b>全氮（凯氏法）</b>，都要干重。碳氮比 = 碳% ÷ 氮%。只有有机质%？碳% ≈ 有机质% ÷ 1.72（例：榴莲壳有机质 63.68%，有机碳 36.94%）。再量含水量，填进“材料”页的“我的材料”。</p>`],
 ['堆好了没有？',`<p>泰国土地发展厅标准：成品碳氮比 ≤20，种子发芽指数 ≥80%。但<b>只看碳氮比不够</b>——日本研究发现它不能单独判断腐熟。还要看：温度回到常温、有泥土味没有臭味、种子测试正常。</p>`],
 ['数值只是平均',`<p>表里的数值是文献平均，您的鸡粪、空果串每一批都会不同。第一次用新来源的材料，最好化验一次，用“改数值”或“我的材料”输入。</p>`]
],
en:[
 ['What is C:N?',`<p>C:N = <b>weight of carbon ÷ weight of nitrogen</b> in a material. 10:1 means 10 parts carbon for every part nitrogen. Lab C% and N% are both on dry weight, so the ratio is the same whether the material is wet or dry.</p><p>Carbon is the microbes' fuel. Nitrogen builds their bodies (protein). Get the ratio right and materials rot fast.</p>`],
 ['24:1 is the microbes\' ideal diet',`${plateSVG()}<p>Soil microbes themselves are about <b>8:1</b>. They burn part of the carbon they eat for energy, so they need a <b>24:1</b> diet: 16 parts carbon burned, 8 parts carbon plus 1 part nitrogen built into their bodies (USDA NRCS).</p>`],
 ['Above 24 borrows N, below 24 releases N',`<p><b>Above 24:1</b> (straw 80, EFB about 52, sawdust over 500): microbes run short of nitrogen and <b>take it from the soil</b> (immobilisation). Crops can go short until the microbes die and release it again.</p><p><b>Below 24:1</b> (chicken manure 6–14, grass clippings 17): the extra nitrogen is released for crops (mineralisation), but the material is gone quickly.</p><p><b>Note:</b> ${t('seesawNote')} The tree's own C:N is a different number; see "Two kinds of C:N: material and tree" below.</p>`],
 ['Compost: start at 25–35, finish at 10–15',`${curveSVG()}<p>A starting C:N near <b>30:1</b> is the usual target (Cornell). 20–40 works and 25–30 is preferred (On-Farm Composting Handbook). A Universiti Putra Malaysia trial of EFB with POME anaerobic sludge found <b>35:1</b> gave the best breakdown.</p><p>As carbon leaves as CO₂, C:N falls; finished compost sits around 10–15.</p><ul><li><b>Too low</b> (&lt;20): nitrogen escapes as ammonia; you smell it.</li><li><b>Too high</b> (&gt;40): the pile stays cool and takes months.</li></ul>`],
 ['Moisture 50–60%',`<p>Moisture is on a <b>wet-weight</b> basis. Most mixes do best at 50–60%. Squeeze test: squeeze a handful hard. One or two drops is right; no water and it crumbles = too dry; water runs out = too wet, it goes airless and smells.</p><p><b>The wet-brown trap:</b> durian husk is a brown by C:N (about 50) but holds about 85% water. Piled fresh it is far too wet. Chop and sun-dry it, or mix in dry browns such as rice husk or sawdust. A Thai trial composting durian husk with citrus peel 1:1 started at 78–85% moisture and never got hot (about 41 °C).</p>`],
 ['Not all carbon rots at the same speed',`<p>Sawdust, EFB and durian husk are high in lignin. Their carbon is tough and slow for microbes, so these can start a little higher in C:N (Cornell). <b>Shredding or pressing</b> speeds things up; most Malaysian mills shred EFB first.</p>`],
 ['Mulch and the orchard',`<p>Fresh high-carbon mulch (EFB, sawdust, straw) borrows nitrogen where it touches the soil. Dug in, it borrows more; left on the surface, it borrows less and more slowly. Soil organic matter itself is about 10:1.</p><p>Practice: keep mulch on the surface, keep a clear ring around the trunk base, keep normal fertilising, and add N only if young trees yellow. Or compost it first. The Mulch tab estimates the most N a tree's mulch can borrow.</p>`],
['Two kinds of C:N: material and tree',`${twoCnSVG()}<p>This app calculates the <b>material C:N</b> of compost and mulch. When growers say "high C:N makes trees flower", they mean the <b>tree's own C:N</b>: carbohydrates made by the leaves against nitrogen taken up by the roots. That is the old theory of Kraus and Kraybill (1918). The two are only loosely linked.</p>
<p><b>Durian evidence:</b> a Monthong trial in Cambodia (Var et al. 2026), after a 28-day dry spell:</p>${droughtSVG()}<p>Leaf N fell, leaf C/N rose, flowers roughly doubled and yield rose about 31% (58.5 → 76.4 kg per tree). The trial did not measure carbohydrates and ran at one site for one year, so it shows these happening together; it does not prove C/N caused the flowering.</p>
<p><b>Not the whole story:</b> in apple, flower induction was not tied to the tree's carbon balance or starch; hormone signals such as gibberellin mattered more (Belhassine et al. 2019). Paclobutrazol works by blocking gibberellin. Severe drought destroys flowers instead (Kozai et al. 2024).</p>
<p><b>Default:</b> steer the tree's C:N with <b>fertiliser timing and water</b>, not with high-carbon mulch or half-made compost. Give N during leaf flush to build a full canopy (the carbohydrate factory for the next flowering); stop N once leaves harden and allow a mild dry spell; add no fresh N-rich material from flowering to fruit set; apply compost only when finished (C:N about 10–20).</p>`],
 ['Does chicken dung bring nematodes?',`<p>Many growers avoid chicken dung for fear of nematodes. That caution is understandable, but most research points the other way:</p><ul><li><b>Chickens are not hosts of plant-parasitic nematodes.</b> Root-knot and similar nematodes need plant roots to multiply; they cannot breed inside a chicken. The small wriggling worms in fresh dung are mostly free-living bacteria-feeders that do not attack roots.</li><li><b>Poultry litter is often used to suppress nematodes.</b> North Carolina trials: 4–6 tons of poultry litter per acre reduced root-knot nematodes and raised cotton yield.</li><li><b>Hot composting kills nematodes.</b> France's ANSES found compost and anaerobic digestion very effective in every condition tested; 50 °C for 30 minutes or 60 °C for 3 minutes killed root-knot and potato cyst nematodes.</li></ul><p>The real risks come from <b>raw, uncomposted dung</b> (root burn, ammonia, flies) or manure mixed with infested soil from elsewhere. So this app by default <b>does not suggest chicken dung</b>; cattle manure, fresh grass or urea can lower C:N too. If you do use chicken dung, follow the conditions below.</p>`],
['Conditions for using chicken dung safely',`${chickSVG()}<ol class="chk">
<li><b>Hot-compost it, with a thermometer.</b> Start at C:N 25–40 and 50–60% moisture. Turned windrow: hold 55–77 °C in the core for 15 days and turn it at least 5 times. Closed or forced-air pile: 3 days (US organic standard §205.203). Push a long probe thermometer into the core; hand feel is not enough. This is far above what kills nematodes (50 °C for 30 minutes) and it also eliminates Salmonella.</li>
<li><b>Use it only when cured.</b> No more heating after turning, earthy smell with no ammonia, C:N ≤20, and a seed test that sprouts normally (≥80%). Half-done compost burns roots.</li>
<li><b>Raw dung: 120 days before harvest.</b> Durian falls on the ground and is picked up to eat, so it counts as a crop whose edible part touches soil. Raw manure must be worked in at least 120 days before harvest. In practice: never raw dung from flowering to harvest.</li>
<li><b>Use a clean source.</b> Poultry-house litter on rice husk or sawdust. Not dung mixed with soil from another farm; that soil is how nematodes and soil diseases really travel. No dead birds; keep it covered and dry until you compost it.</li>
<li><b>Put it in the right place.</b> Spread on the surface toward the outer canopy, where the feeding roots are, at a moderate rate. Never heap it against the trunk.</li></ol>`],
 ['How much compost to apply?',`<p><b>No published durian compost rate was found.</b> Thailand's Department of Agriculture 2022 durian report says only to use organic fertiliser together with chemical fertiliser, with no amount.</p>
<p>The Malaysian official figure found is for <b>chicken manure</b>: Sarawak's Department of Agriculture recommends 5–10 kg per planting hole, then 20–40 kg per tree per year, on top of chemical fertiliser.</p>
<p><b>Default:</b> treat that range as an upper guide, spread across the year on the surface toward the canopy edge, and skip the flowering-to-fruit-set window (see the Mulch tab). Finished compost differs batch to batch; for large amounts, lab-test its N, P and K and check it against your fertiliser plan with your agronomist.</p>`],
 ['Reading a lab report',`<p>Ask for <b>organic carbon</b> and <b>total nitrogen (Kjeldahl)</b>, both on dry weight. C:N = C% ÷ N%. Only organic matter given? C% ≈ OM% ÷ 1.72 (durian husk: OM 63.68%, organic C 36.94%). Measure moisture too, then enter it under My materials.</p>`],
 ['Is the compost finished?',`<p>Thailand's Land Development Department standard: finished C:N ≤20 and seed germination index ≥80%. <b>C:N alone is not proof</b>; a Japanese study found it unreliable as a maturity index on its own. Also check: temperature back to ambient, earthy smell with no stink, and a seed test that sprouts normally.</p>`],
 ['Values are averages',`<p>Table values are published averages. Every batch of chicken manure or EFB differs. When you start with a new source, lab-test it once and enter the values with Edit values or My materials.</p>`]
],
ms:[
 ['Apakah nisbah C:N?',`<p>C:N = <b>berat karbon ÷ berat nitrogen</b> dalam sesuatu bahan. 10:1 bermakna 10 bahagian karbon bagi setiap 1 bahagian nitrogen. C% dan N% makmal kedua-duanya berat kering, jadi nisbahnya sama sama ada bahan basah atau kering.</p><p>Karbon ialah bahan api mikrob. Nitrogen membina badan mereka (protein). Nisbah yang betul membuat bahan reput cepat.</p>`],
 ['24:1 ialah diet terbaik mikrob',`${plateSVG()}<p>Mikrob tanah sendiri kira-kira <b>8:1</b>. Sebahagian karbon dibakar untuk tenaga, jadi mereka perlukan diet <b>24:1</b>: 16 bahagian karbon dibakar, 8 bahagian karbon dan 1 bahagian nitrogen menjadi badan (USDA NRCS).</p>`],
 ['Atas 24 meminjam N, bawah 24 membebaskan N',`<p><b>Atas 24:1</b> (jerami 80, EFB ~52, habuk kayu lebih 500): mikrob kekurangan nitrogen dan <b>mengambilnya dari tanah</b> (imobilisasi). Tanaman boleh kekurangan N sehingga mikrob mati dan membebaskannya semula.</p><p><b>Bawah 24:1</b> (tahi ayam 6–14, rumput 17): N berlebihan dibebaskan untuk tanaman (mineralisasi), tetapi bahan cepat habis.</p><p><b>Nota:</b> ${t('seesawNote')} C:N pokok sendiri ialah nombor lain; lihat "Dua jenis C:N: bahan dan pokok" di bawah.</p>`],
 ['Kompos: mula 25–35, siap 10–15',`${curveSVG()}<p>C:N permulaan sekitar <b>30:1</b> ialah sasaran biasa (Cornell). 20–40 boleh, 25–30 paling baik (On-Farm Composting Handbook). Kajian Universiti Putra Malaysia (EFB + enapcemar anaerobik POME) mendapati <b>35:1</b> paling baik.</p><p>Karbon keluar sebagai CO₂, jadi C:N menurun; kompos siap sekitar 10–15.</p><ul><li><b>Terlalu rendah</b> (&lt;20): nitrogen lari sebagai ammonia; berbau.</li><li><b>Terlalu tinggi</b> (&gt;40): longgokan sejuk, berbulan-bulan.</li></ul>`],
 ['Lembapan 50–60%',`<p>Lembapan ialah berat <b>basah</b>. Kebanyakan campuran terbaik pada 50–60%. Ujian genggam: genggam kuat. Satu dua titis = tepat; tiada air dan berderai = terlalu kering; air mengalir = terlalu basah, tiada udara dan berbau.</p><p><b>Perangkap bahan perang basah:</b> kulit durian ialah bahan perang (C:N ~50) tetapi ~85% air. Jika dilonggok segar, terlalu basah. Cincang dan jemur, atau campur bahan perang kering seperti sekam padi atau habuk kayu. Kajian Thailand (kulit durian + kulit limau 1:1) bermula pada lembapan 78–85% dan tidak panas (~41 °C).</p>`],
 ['Tidak semua karbon sama laju',`<p>Habuk kayu, EFB dan kulit durian tinggi lignin. Karbonnya keras dan lambat dimakan mikrob, jadi boleh bermula dengan C:N lebih tinggi sedikit (Cornell). <b>Mencincang atau memampat</b> mempercepat; kebanyakan kilang di Malaysia mencincang EFB dahulu.</p>`],
 ['Sungkupan dan dusun',`<p>Sungkupan segar tinggi karbon (EFB, habuk kayu, jerami) meminjam N di tempat ia menyentuh tanah. Jika dibenam, lebih banyak dipinjam; di permukaan, kurang dan lebih perlahan. Bahan organik tanah sendiri ~10:1.</p><p>Amalan: biar di permukaan, kosongkan sekeliling pangkal batang, teruskan baja biasa, tambah N hanya jika pokok muda menguning. Atau kompos dahulu. Tab Sungkupan menganggar N maksimum yang dipinjam.</p>`],
['Dua jenis C:N: bahan dan pokok',`${twoCnSVG()}<p>Aplikasi ini mengira <b>C:N bahan</b> (kompos, sungkupan). Bila pekebun kata "C:N tinggi membuat pokok berbunga", maksudnya <b>C:N pokok itu sendiri</b>: karbohidrat yang dibuat daun berbanding nitrogen yang diserap akar. Itu teori lama Kraus dan Kraybill (1918). Kedua-duanya hanya berkait secara tidak langsung.</p>
<p><b>Bukti durian:</b> ujian Monthong di Kemboja (Var et al. 2026), selepas kemarau 28 hari:</p>${droughtSVG()}<p>N daun turun, C/N daun naik, bunga hampir dua kali ganda dan hasil naik ~31% (58.5 → 76.4 kg sepokok). Ujian itu tidak mengukur karbohidrat dan hanya satu tapak, satu tahun; ia menunjukkan semuanya berlaku serentak, bukan membuktikan C/N menyebabkan pembungaan.</p>
<p><b>Bukan keseluruhan cerita:</b> pada epal, aruhan bunga tidak berkait dengan imbangan karbon atau kanji pokok; isyarat hormon seperti giberelin lebih penting (Belhassine et al. 2019). Paklobutrazol berfungsi dengan menyekat giberelin. Kemarau teruk pula merosakkan bunga (Kozai et al. 2024).</p>
<p><b>Lalai:</b> kawal C:N pokok dengan <b>masa pembajaan dan air</b>, bukan dengan sungkupan tinggi karbon atau kompos separuh masak. Beri N semasa pucuk baru untuk kanopi penuh (kilang karbohidrat untuk pembungaan seterusnya); hentikan N bila daun matang dan biarkan kemarau ringan; jangan tambah bahan kaya N segar dari berbunga hingga pembentukan buah; guna kompos hanya bila sudah matang (C:N ~10–20).</p>`],
 ['Adakah tahi ayam membawa nematod?',`<p>Ramai pekebun mengelak tahi ayam kerana takut nematod. Itu boleh difahami, tetapi kebanyakan kajian menunjukkan sebaliknya:</p><ul><li><b>Ayam bukan perumah nematod parasit tumbuhan.</b> Nematod puru akar dan seumpamanya perlukan akar pokok untuk membiak; ia tidak membiak dalam ayam. Cacing kecil yang menggeliat dalam tahi segar kebanyakannya nematod hidup bebas pemakan bakteria yang tidak menyerang akar.</li><li><b>Hampas reban ayam sering digunakan untuk menekan nematod.</b> Ujian North Carolina: 4–6 tan sekeker mengurangkan nematod puru akar dan menaikkan hasil kapas.</li><li><b>Kompos panas membunuh nematod.</b> ANSES Perancis: kompos dan pencernaan anaerobik sangat berkesan dalam semua keadaan diuji; 50 °C selama 30 minit atau 60 °C selama 3 minit membunuh nematod puru akar dan nematod sista kentang.</li></ul><p>Risiko sebenar datang daripada <b>tahi mentah yang belum dikompos</b> (akar terbakar, ammonia, lalat) atau tahi bercampur tanah berpenyakit dari tempat lain. Jadi aplikasi ini secara lalai <b>tidak mencadangkan tahi ayam</b>; tahi lembu, rumput segar atau urea juga boleh menurunkan C:N. Jika mahu guna tahi ayam, ikut syarat di bawah.</p>`],
['Syarat menggunakan tahi ayam dengan selamat',`${chickSVG()}<ol class="chk">
<li><b>Kompos panas, dengan termometer.</b> Mula pada C:N 25–40 dan lembapan 50–60%. Longgokan memanjang: kekalkan 55–77 °C di tengah selama 15 hari dan balikkan sekurang-kurangnya 5 kali. Longgokan tertutup atau beraliran udara: 3 hari (piawaian organik AS §205.203). Cucuk termometer prob panjang ke tengah; rasa tangan tidak cukup. Suhu ini jauh melebihi yang membunuh nematod (50 °C selama 30 minit) dan turut menghapuskan Salmonella.</li>
<li><b>Guna hanya bila sudah matang.</b> Tidak panas lagi selepas dibalikkan, bau tanah tanpa bau ammonia, C:N ≤20, dan ujian biji bercambah normal (≥80%). Kompos separuh masak membakar akar.</li>
<li><b>Tahi mentah: 120 hari sebelum tuai.</b> Durian gugur ke tanah lalu dikutip untuk dimakan, jadi ia dikira tanaman yang bahagian boleh dimakan menyentuh tanah. Tahi mentah mesti dibenamkan sekurang-kurangnya 120 hari sebelum tuai. Amalannya: jangan langsung guna tahi mentah dari berbunga hingga tuai.</li>
<li><b>Sumber mesti bersih.</b> Hampas reban bersekam atau berhabuk kayu. Bukan tahi bercampur tanah dari ladang lain; tanah itulah laluan sebenar nematod dan penyakit tanah. Tiada bangkai ayam; tutup dan simpan kering sebelum dikompos.</li>
<li><b>Letak di tempat betul.</b> Tabur di permukaan ke arah pinggir kanopi, tempat akar penyerap, pada kadar sederhana. Jangan longgok pada pangkal batang.</li></ol>`],
 ['Berapa banyak kompos perlu ditabur?',`<p><b>Tiada kadar kompos durian yang diterbitkan ditemui.</b> Laporan durian Jabatan Pertanian Thailand 2022 hanya menyebut baja organik digunakan bersama baja kimia, tanpa jumlah.</p>
<p>Angka rasmi Malaysia yang ditemui ialah untuk <b>tahi ayam</b>: Jabatan Pertanian Sarawak mengesyorkan 5–10 kg selubang semasa menanam, kemudian 20–40 kg sepokok setahun, di samping baja kimia.</p>
<p><b>Lalai:</b> anggap julat itu sebagai panduan maksimum, tabur sepanjang tahun di permukaan ke arah pinggir kanopi, dan elakkan tempoh berbunga hingga pembentukan buah (lihat tab Sungkupan). Kompos siap berbeza setiap kelompok; untuk jumlah besar, uji N, P dan K di makmal dan semak dengan pelan baja bersama ahli agronomi anda.</p>`],
 ['Membaca laporan makmal',`<p>Minta <b>karbon organik</b> dan <b>nitrogen jumlah (Kjeldahl)</b>, kedua-duanya berat kering. C:N = C% ÷ N%. Hanya ada bahan organik? C% ≈ BO% ÷ 1.72 (kulit durian: BO 63.68%, C organik 36.94%). Ukur lembapan, kemudian masukkan di Bahan saya.</p>`],
 ['Sudah siapkah kompos?',`<p>Piawaian Jabatan Pembangunan Tanah Thailand: C:N siap ≤20 dan indeks percambahan biji ≥80%. <b>C:N sahaja bukan bukti</b>; kajian Jepun mendapati ia tidak boleh dipercayai sebagai indeks kematangan sendirian. Periksa juga: suhu kembali seperti udara, bau tanah tanpa bau busuk, dan ujian biji bercambah normal.</p>`],
 ['Nilai ialah purata',`<p>Nilai jadual ialah purata terbitan. Setiap kelompok tahi ayam atau EFB berbeza. Bila guna sumber baharu, uji di makmal sekali dan masukkan dengan Ubah nilai atau Bahan saya.</p>`]
